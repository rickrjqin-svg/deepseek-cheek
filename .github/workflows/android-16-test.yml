name: Android 16 Launch Test

on:
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold launch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.rickrjqin.deepseekbalance
            adb shell am start -W -n com.rickrjqin.deepseekbalance/.MainActivity
            sleep 4
            test -n "$(adb shell pidof com.rickrjqin.deepseekbalance)"
            adb shell input tap 950 330
            sleep 3
            test -n "$(adb shell pidof com.rickrjqin.deepseekbalance)"
            adb exec-out screencap -p > android-16-settings.png
            ! adb logcat -d -b crash | grep -q "com.rickrjqin.deepseekbalance"
      - name: Upload Android 16 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-16-settings-preview
          path: android-16-settings.png
