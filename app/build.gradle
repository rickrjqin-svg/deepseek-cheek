plugins {
    id "com.android.application"
}

android {
    namespace "com.rickrjqin.deepseekbalance"
    compileSdk 35

    defaultConfig {
        applicationId "com.rickrjqin.deepseekbalance"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "deepseek-balance"
            keyAlias "deepseek"
            keyPassword "deepseek-balance"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
